version: "3.9"

# i-educar — Testes de Performance
# 
# Serviços:
#   locust-master  → interface web (porta 8089) + coordenador dos workers
#   locust-worker  → executa as tasks (escale com --scale locust-worker=N)
#   report         → gera o PDF após os testes (roda e sai)

x-locust-common: &locust-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    TARGET_HOST:    ${TARGET_HOST:-http://host.docker.internal}
    IEDUCAR_USER:   ${IEDUCAR_USER:-admin}
    IEDUCAR_PASS:   ${IEDUCAR_PASS:-admin}
    TEST_DURATION:  ${TEST_DURATION:-60s}
    SPAWN_RATE:     ${SPAWN_RATE:-5}
  volumes:
    - ./results:/app/results
    - ./reports:/app/reports
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  locust-master:
    <<: *locust-common
    container_name: ieducar_locust_master
    command: >
      locust
        --master
        --host=${TARGET_HOST:-http://host.docker.internal}
        --web-port=8089
        -f /app/locustfile.py
    ports:
      - "8089:8089"
    profiles: ["distributed"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  locust-worker:
    <<: *locust-common
    command: >
      locust
        --worker
        --master-host=locust-master
        -f /app/locustfile.py
    depends_on:
      - locust-master
    profiles: ["distributed"]
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  locust-headless:
    <<: *locust-common
    container_name: ieducar_locust_headless
    command: bash -c "./run_test.sh ${TARGET_HOST:-http://host.docker.internal}"
    profiles: ["headless"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  report:
    <<: *locust-common
    container_name: ieducar_report
    command: python scripts/generate_report.py
    profiles: ["report"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

# ============================================================================
# Uso rápido:
#
#   # Testes headless (10, 50, 100 usuários) + relatório:
#   docker compose --profile headless up
#   docker compose --profile report    up
#
#   # Interface web interativa (modo distribuído):
#   docker compose --profile distributed up --scale locust-worker=4
#   # → acesse http://localhost:8089
#
#   # Sobrescrever host alvo:
#   TARGET_HOST=http://192.168.1.100 docker compose --profile headless up
# ============================================================================